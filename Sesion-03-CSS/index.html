<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Anime Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Galería de Productos - Anime Store</h1>

        <!-- TODO: Galería de productos
             Cada tarjeta debe contener:
             - Imagen del producto (usa placeholder o imágenes de ejemplo)
             - Nombre del producto
             - Precio
             - Botón con texto "Comprar"
             
             Desktop (>=1024px): 3 columnas
             Mobile (<768px): 1 columna con scroll vertical
        -->
        <section class="galeria">

            <article class="producto">
                <img src="https://via.placeholder.com/300x200/e0e0e0/333?text=Naruto+Figura" alt="Figura coleccionable de Naruto Uzumaki">
                <div class="producto-info">
                    <h2>Naruto Uzumaki Figura de colección</h2>
                    <p class="precio">Q359.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://via.placeholder.com/300x200/e0e0e0/333?text=One+Piece+Manga" alt="Tomo 1 del manga de One Piece">
                <div class="producto-info">
                    <h2>Manga de One Piece Tomo 1</h2>
                    <p class="precio">Q150.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://via.placeholder.com/300x200/e0e0e0/333?text=Peluche+Mi+Vecino+Totoro" alt="Peluche de Mi Vecino Totoro">
                <div class="producto-info">
                    <h2>Peluche de Mi Vecino Totoro</h2>
                    <p class="precio">Q200.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://via.placeholder.com/300x200/e0e0e0/333?text=Playera+Zoro" alt="Playera con estampado de Zoro">
                <div class="producto-info">
                    <h2>Playera de Zoro Roronoa</h2>
                    <p class="precio">Q75.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://via.placeholder.com/300x200/e0e0e0/333?text=Sombrero+Chopper" alt="Sombrero Tony Tony Chopper">
                <div class="producto-info">
                    <h2>Sombrero Tony Tony Chopper</h2>
                    <p class="precio">Q270.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://via.placeholder.com/300x200/e0e0e0/333?text=LLavero+Kakashi" alt="LLavero de Kakashi">
                <div class="producto-info">
                    <h2>LLavero de Kakashi - Naruto</h2>
                    <p class="precio">Q50.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

        <h2>To-Do List</h2>

        <!-- TODO: Layout de Todo List
             Lista de tareas estilizada con:
             - Checkbox para marcar completado
             - Texto de la tarea
             - Diseño limpio y accesible
        -->
        <section class="todo-list">
            <ul class="tareas" role="list">
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Preparar los envíos de la semana</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Publicar la nueva mercancía</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Responder mensajes de los clientes</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Revisar inventario de productos</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Ordenar nueva mercancía</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
